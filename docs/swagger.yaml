host: aino-medical.tirtahakimpambudhi.web.id
info:
  contact: {}
  description: This is a sample swagger for Fiber
  title: Aino Medical API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Login a user with the provided credentials.
      parameters:
      - description: Login User Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.LoginRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.UserResponseWrapper'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorWrapper'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorWrapper'
      summary: Login a user
      tags:
      - Users
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user with the provided details.
      parameters:
      - description: Create User Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.RegisterRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.UserResponseWrapper'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorWrapper'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorWrapper'
      summary: Create a new user
      tags:
      - Users
  /api/v1/benefits:
    get:
      consumes:
      - application/json
      description: Find benefit types by their attributes.
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - description: Number of items per page
        in: query
        name: limit
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.BenefitResponseWrapper'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorWrapper'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorWrapper'
      security:
      - BearerAuth bearer: []
      summary: Find benefit types
      tags:
      - Benefit Types
    post:
      consumes:
      - application/json
      description: Create a new benefit type with the provided details.
      parameters:
      - description: Create Benefit Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/model.CreateBenefitRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.BenefitResponseWrapper'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorWrapper'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorWrapper'
      security:
      - BearerAuth bearer: []
      summary: Create a new benefit type
      tags:
      - Benefit Types
  /api/v1/benefits/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a benefit type with the provided details.
      parameters:
      - description: Benefit ID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.BaseResponseWrapper'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorWrapper'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorWrapper'
      security:
      - BearerAuth bearer: []
      summary: Delete a benefit type
      tags:
      - Benefit Types
    get:
      consumes:
      - application/json
      description: Get a benefit type by its ID.
      parameters:
      - description: Benefit ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.BenefitResponseWrapper'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/model.ErrorWrapper'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/model.ErrorWrapper'
      security:
      - BearerAuth bearer: []
      summary: Get a benefit type by ID
      tags:
      - Benefit Types
    put:
      consumes:
      - application/json
      description: Update a benefit type with the provided details.
      parameters:
      - description: Update Benefit Request
        in: body
        name: request
        required: true
